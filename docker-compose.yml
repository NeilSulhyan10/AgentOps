version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agentops-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agentops
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentops-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    container_name: agentops-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=agentops
      - LLM_PROVIDER=nemotron
      - NEMOTRON_API_KEY=${NEMOTRON_API_KEY}
      - NEMOTRON_API_URL=https://integrate.api.nvidia.com/v1
      - NEMOTRON_MODEL=nvidia/nemotron-3-ultra-550b-a55b
      - MAX_ITERATIONS=5
      - CONFIDENCE_THRESHOLD=0.75
      - ENABLE_LLM_ROUTING=true
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - agentops-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    container_name: agentops-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - agentops-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  mongodb_data:

networks:
  agentops-network:
    driver: bridge